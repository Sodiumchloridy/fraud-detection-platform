<header class="sticky top-0 z-40 backdrop-blur-md bg-white/70 border-b border-slate-200/60">
  <div class="max-w-screen-2xl mx-auto px-6 lg:px-10 2xl:px-16">
    <div class="flex h-16">
      <div class="-ml-6 mr-auto">
        <img src="logo.png" alt="Logo" class="h-16 object-cover cursor-pointer" routerLink="/dashboard">
      </div>

      <div class="flex items-center gap-2">
        @if (showAdminOptions) {
        <nav class="flex items-center gap-1 mr-2">
          <a routerLink="/admin/users"
            class="px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition">User Management</a>
          <a routerLink="/admin/system-settings"
            class="px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition">Platform Configuration</a>
        </nav>
        }

        <a routerLink="/flagged-transactions"
          class="relative inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-slate-600 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition mr-1">
          <svg class="size-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          Alerts
          @if (pendingReview > 0) {
            <span class="absolute -top-1 -right-1 min-w-[1.15rem] h-[1.15rem] flex items-center justify-center rounded-full bg-amber-500 text-[10px] font-bold text-white leading-none px-1">
              {{ pendingReview > 99 ? '99+' : pendingReview }}
            </span>
          }
        </a>

        <div class="relative">
          <button (click)="toggleDropdown()"
            class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
            <div
              class="size-7 rounded-lg bg-slate-200 flex items-center justify-center text-xs font-semibold text-slate-500">
              {{ userName.charAt(0) | uppercase }}</div>
            Account
            <svg class="size-4 text-slate-400" fill="none" viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5">
              <path d="m6 8 4 4 4-4" />
            </svg>
          </button>

          @if (isDropdownOpen) {
          <div class="absolute right-0 mt-2 w-48 rounded-2xl bg-white shadow-lg ring-1 ring-slate-200/60 py-1.5 z-50">
            <span class="block font-bold px-4 mx-1.5 py-2 text-sm text-slate-600">{{ userName }}</span>
            <hr class="my-1.5 border-slate-100">
            <a routerLink="/settings" (click)="isDropdownOpen = false"
              class="block px-4 py-2 text-sm text-slate-600 hover:bg-slate-50 rounded-lg mx-1.5">Settings</a>
            <hr class="my-1.5 border-slate-100">
            <a (click)="logout.emit()"
              class="block px-4 py-2 text-sm text-rose-600 hover:bg-rose-50 rounded-lg mx-1.5 cursor-pointer">Logout</a>
          </div>
          }
        </div>
      </div>
    </div>
  </div>
</header>
