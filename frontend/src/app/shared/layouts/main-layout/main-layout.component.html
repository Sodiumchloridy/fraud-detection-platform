<div class="min-h-screen bg-[#f0f2f5]">
  <app-header
    [pageTitle]="pageTitle"
    [userName]="userName"
    [showAdminOptions]="isAdmin"
    [pendingReview]="pendingReview"
    (logout)="handleLogout()">
  </app-header>
  <main class="max-w-screen-2xl mx-auto px-6 lg:px-10 2xl:px-16 py-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">{{ pageTitle }}</h1>
    <ng-content></ng-content>
  </main>
  <app-fraud-copilot [transaction]="copilotTransaction" [dashboardContext]="copilotDashboardContext"></app-fraud-copilot>
</div>
