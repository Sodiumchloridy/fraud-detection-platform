<app-main-layout [pageTitle]="'Settings'">
  <a routerLink="/dashboard" class="inline-flex items-center gap-1 text-xs font-medium text-slate-400 hover:text-indigo-600 transition mb-5">&larr; Dashboard</a>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

    <!-- MFA card — spans 2 -->
    <div class="md:col-span-2 bg-white rounded-[1.25rem] shadow-[0_1px_3px_rgba(0,0,0,.04)] p-7">
      <h2 class="text-sm font-semibold text-slate-800 mb-5 pb-4 border-b border-slate-100">Multi-Factor Authentication</h2>
      <div class="flex items-center justify-between py-4 border-b border-slate-100">
        <div><p class="text-sm font-medium text-slate-700">Enable MFA</p><p class="text-xs text-slate-400 mt-0.5">Require a second authentication factor.</p></div>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" [(ngModel)]="mfaEnabled" class="sr-only peer">
          <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-indigo-500 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div>
        </label>
      </div>
      <div class="flex items-center justify-between py-4 border-b border-slate-100">
        <div><p class="text-sm font-medium text-slate-700">Authenticator App</p><p class="text-xs text-slate-400 mt-0.5">Google Authenticator</p></div>
        <button class="text-xs font-medium text-[#2D8C8C] border border-[#2D8C8C] bg-white px-3.5 py-2 rounded-xl hover:bg-[#2D8C8C]/5 transition">Remove</button>
      </div>
    </div>
  </div>
</app-main-layout>
