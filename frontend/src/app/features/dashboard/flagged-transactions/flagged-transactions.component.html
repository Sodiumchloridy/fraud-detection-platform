<app-main-layout [pageTitle]="'Flagged Transactions'">
  <a (click)="goBack()" class="inline-flex items-center gap-1 text-xs font-medium text-slate-400 hover:text-indigo-600 transition mb-5 cursor-pointer">&larr; Back</a>

  <div class="bg-white rounded-[1.25rem] shadow-[0_1px_3px_rgba(0,0,0,.04)] overflow-hidden">
    <div class="px-7 py-5 border-b border-slate-100">
      <h2 class="text-sm font-semibold text-slate-800">Flagged Transactions</h2>
    </div>
    <app-transaction-list
      [transactions]="(flaggedTransactions$ | async) || []"
      [readIds]="(readIds$ | async) || emptySet"
      (itemClick)="onTransactionClick($event)"
      emptyMessage="No flagged transactions">
    </app-transaction-list>
  </div>
</app-main-layout>
