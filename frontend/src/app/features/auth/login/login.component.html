<div class="flex items-center justify-center min-h-screen bg-[#f0f2f5]">
  <div class="w-full max-w-sm px-4">
    <!-- Logo -->
    <div class="flex justify-center mb-8">
      <img src="logo.png" alt="Logo" class="object-cover">
    </div>

    <div class="bg-white rounded-[1.25rem] shadow-[0_2px_8px_rgba(0,0,0,.06)] p-8">
      @if (showTwoFactor) {
        <h1 class="text-xl font-bold text-slate-800 text-center">Two-Factor Authentication</h1>
        <p class="text-sm text-slate-400 text-center mt-1 mb-8">Enter the code from your authenticator app</p>

        <form (ngSubmit)="verify()">
          @if (errorMessage) {
            <div class="mb-5 px-4 py-3 bg-rose-50 text-rose-600 rounded-xl text-sm">{{ errorMessage }}</div>
          }
          <div class="mb-6">
            <label for="code" class="block text-xs font-medium text-slate-500 mb-1.5">Verification Code</label>
            <input type="text" id="code" [(ngModel)]="code" name="code" maxlength="6" autocomplete="one-time-code"
              class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition text-center tracking-[0.3em] text-lg font-mono"
              required>
          </div>
          <button type="submit"
            class="w-full bg-[#2D8C8C] text-white py-2.5 rounded-xl font-medium text-sm hover:bg-[#267878] transition shadow-sm">
            Verify
          </button>
        </form>
        <button (click)="backToLogin()" class="w-full mt-3 text-xs text-slate-400 hover:text-indigo-600 transition">&larr; Back to login</button>
      } @else {
        <h1 class="text-xl font-bold text-slate-800 text-center">Welcome back</h1>
        <p class="text-sm text-slate-400 text-center mt-1 mb-8">Sign in to Fraud Detection Platform</p>

        <form (ngSubmit)="login()">
          @if (errorMessage) {
            <div class="mb-5 px-4 py-3 bg-rose-50 text-rose-600 rounded-xl text-sm">{{ errorMessage }}</div>
          }
          <div class="mb-5">
            <label for="username" class="block text-xs font-medium text-slate-500 mb-1.5">Username</label>
            <input type="text" id="username" [(ngModel)]="username" name="username"
              class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition"
              required>
          </div>
          <div class="mb-6">
            <label for="password" class="block text-xs font-medium text-slate-500 mb-1.5">Password</label>
            <input type="password" id="password" [(ngModel)]="password" name="password"
              class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-400 transition"
              required>
          </div>
          <button type="submit"
            class="w-full bg-[#2D8C8C] text-white py-2.5 rounded-xl font-medium text-sm hover:bg-[#267878] transition shadow-sm">
            Sign In
          </button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-400">Try: admin / admin123</p>
      }
    </div>
  </div>
</div>
