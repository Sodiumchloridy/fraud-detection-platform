# Application
spring.application.name=fraud-detection-backend

# Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Enable detailed error messages in responses (for development)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# JWT Configuration
jwt.secret=ZnJhdWQtZGV0ZWN0aW9uLXBsYXRmb3JtLXN1cGVyLXNlY3JldC1rZXktMjAyNi1hdC1sZWFzdC0zMi1ieXRlcw==
jwt.expiration=86400000

# Fraud Engine
fraud-engine.base-url=http://localhost:8000
fraud-engine.api-key=fd-internal-key-2026

# Logging
logging.exception-conversion-word=%wEx{5}
logging.level.com.workshop.backend=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework=ERROR
logging.level.root=ERROR

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=fraud-detection-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*